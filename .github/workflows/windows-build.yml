name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve build metadata
        id: metadata
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            if ($env:REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
              throw "Release tags must use semantic versioning, for example v0.3.0"
            }
            $version = $env:REF_NAME.Substring(1)
          }
          else {
            $package = Get-Content frontend/package.json -Raw | ConvertFrom-Json
            $version = $package.version
          }

          $artifactName = "Nblink-Companion-$version-windows-amd64"
          "VERSION=$version" >> $env:GITHUB_ENV
          "BUILD_NUMBER=${{ github.run_number }}" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

      - name: Test and build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Test Go packages
        shell: pwsh
        run: go test ./...

      - name: Build Windows executable
        shell: pwsh
        env:
          SKIP_FRONTEND_BUILD: "1"
        run: .\scripts\build-windows.ps1

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-Item "dist\windows\amd64\Nblink-Companion-$env:VERSION-windows-amd64.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "$($exe.FullName).sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/windows/amd64/*.exe
            dist/windows/amd64/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-windows.outputs.artifact_name }}
          path: release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag \
            --generate-notes \
            --title "Nblink Companion $RELEASE_VERSION"
